name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      CODEX_APP_SERVER_URL: https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-app-server-x86_64-pc-windows-msvc.exe.zip
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare build inputs
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $nugetPackages = Join-Path $env:RUNNER_TEMP 'nuget-packages'
          $appServerZip = Join-Path $env:RUNNER_TEMP 'codex-app-server-x86_64-pc-windows-msvc.exe.zip'
          Invoke-WebRequest -Uri $env:CODEX_APP_SERVER_URL -OutFile $appServerZip
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$nugetPackages" >> $env:GITHUB_ENV
          "CODEX_APP_SERVER_ZIP=$appServerZip" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore .\AiAccountManager.slnx

      - name: Build
        run: dotnet build .\AiAccountManager.slnx -c Release --no-restore "-p:Version=$env:APP_VERSION" "-p:CodexAppServerZipPath=$env:CODEX_APP_SERVER_ZIP"

      - name: Test
        # UI 測試需要互動式桌面並會啟動實際程式，release 流程只跑單元與元件測試。
        run: dotnet test .\AiAccountManager.slnx -c Release --no-build --verbosity minimal --filter "TestCategory!=UI"

      - name: Package
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\package-windows.ps1 -Version $env:APP_VERSION -AppServerZipPath $env:CODEX_APP_SERVER_ZIP -NugetPackagesPath $env:NUGET_PACKAGES

      - name: Generate WinGet manifest
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\New-WinGetManifest.ps1 -Version $env:APP_VERSION

      - name: Validate WinGet manifest
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest "artifacts\winget\$env:APP_VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning 'winget is unavailable; manifest validation was skipped.'
          }

      - name: Upload WinGet manifest
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifest
          path: artifacts/winget/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack
          path: artifacts/releases/*

  # 上傳 velopack artifact 為附件；gh 會先建立草稿，附件上傳完成後才公開
  create-release:
    needs: build
    permissions:
      contents: write
    uses: CloudyWing/devops-templates/.github/workflows/reusable-create-release.yml@v1
    with:
      artifact-name: velopack
